<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сайт на актуалізації</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400&amp;family=Montserrat:wght@700&amp;display=swap" rel="stylesheet">
	<link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <img class="logo" src="Oschad_logo.jpg" alt="Логотип">
        <h1>Тестовий полігон MMFO_19 на актуалізації</h1>
        <p id="message">Наразі проводиться актуалізація тестового полігону MMFO_19.</p>

        <p id="timer" style="font-size: 1.4em; margin-top: 20px;">

        </p>

        <p id="averageTimer" style="font-size: 1.2em; margin-top: 10px; color: rgb(160, 192, 255); display: none;">
            Середній час оновлення: <span id="averageTime">11:16:40</span>
        </p>

        <div class="footer">Дякуємо за ваше розуміння.</div>
    </div>
